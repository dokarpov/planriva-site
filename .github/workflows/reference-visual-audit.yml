name: Planriva reference visual audit
on:
  workflow_dispatch:
  push:
    branches: [rebuild/react-v2]
    paths:
      - 'preview-v2/reference-capture.mjs'
      - '.github/workflows/reference-visual-audit.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture reference and Planriva at 4 viewports
        run: node preview-v2/reference-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planriva-reference-audit
          path: reference-captures/
          retention-days: 14
